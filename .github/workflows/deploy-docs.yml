name: Deploy Docs

# Manual only. This fork (imcitius/stoneforge) is the main repository; the
# upstream stoneforge-ai/stoneforge project is no longer maintained.
# This workflow deploys to the upstream Cloudflare Pages project
# "stoneforge-docs" (docs.stoneforge.ai) and needs CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets that the fork does not have. The automatic
# push-to-master and pull_request preview triggers were removed so that master
# pushes and PRs do not try to deploy to upstream hosting. The site sources in
# apps/docs/ are kept. Run it manually only after configuring hosting and
# secrets that this repository owns.

on:
  workflow_dispatch:

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy

    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not configured for this repository; refusing to deploy."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 8.15.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm turbo run build --filter=@stoneforge/docs

      - name: Deploy to Cloudflare Pages
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: pnpm exec wrangler pages deploy dist --project-name=stoneforge-docs --branch="$DEPLOY_BRANCH"
