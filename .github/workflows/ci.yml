name: CI

# Runs on push and pull_request to master (imcitius/stoneforge is the main
# repository). Nothing in this workflow publishes packages or creates tags or
# releases. The upstream npm publish workflow (publish.yml) was removed; macOS
# Desktop releases are built from v* tags by a separate workflow.
#
# Tests run through `pnpm check:ci` (scripts/check-ci.mjs), which runs the
# repository acceptance gate itself (scripts/check-merge.mjs, see
# docs/merge-checks.md): the same Node/native preflight and the same step list -
# gate regression tests, uncached typecheck, Desktop build, each *.bun.test.ts
# in its own Bun process, Smithy's Vitest suite under Node and the Desktop Node
# tests. No step is filtered. Two Desktop tests skip themselves off macOS and are
# reported as skipped: external-server adoption (macOS-only lsof discovery) and
# the Electron macOS EINVAL socket workaround. `pnpm check:merge` refuses
# non-macOS hosts for that reason. See docs/merge-checks.md, "CI vs gate".
#
# History: until el-2wx7k3 this job ran `bun test src` per package. In Smithy
# that loads the Vitest *.test.ts files under Bun and shares one Bun process
# across files; locally (Bun 1.3.11, Node 22.23.3) it exited 1 with 2118 pass,
# 21 skip, 56 fail, 1 error, while the gate passed.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.5

      - uses: actions/setup-node@v4
        with:
          # Same Node as the Desktop runtime pin and the check:merge gate.
          node-version: 22.23.3
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-python@v5
        with:
          # node-pty 1.1.0 ships no Linux prebuild, so pnpm install compiles it
          # with pnpm 8.15.5's bundled node-gyp 9.4.1. That node-gyp imports
          # distutils, which Python 3.12 (the ubuntu-24.04 default) removed.
          python-version: '3.11'

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - name: Pre-merge gate (CI selection)
        run: pnpm check:ci
