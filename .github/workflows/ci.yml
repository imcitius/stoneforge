name: CI

# Runs on push and pull_request to master (imcitius/stoneforge is the main
# repository). Nothing in this workflow publishes packages or creates tags or
# releases. The upstream npm publish workflow (publish.yml) was removed; macOS
# Desktop releases are built from v* tags by a separate workflow.
#
# Known failure (pre-existing, not hidden): "Test packages/smithy" runs
# `bun test src`, which also loads Smithy's Vitest *.test.ts files under Bun and
# shares one Bun process across files. Locally (Bun 1.3.11, Node 22.23.3) it
# exits 1: 2118 pass, 21 skip, 56 fail, 1 error. The repository acceptance gate
# is `pnpm check:merge` (docs/merge-checks.md), which runs each *.bun.test.ts in
# its own process plus Vitest under Node; it is documented for macOS arm64.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.5

      - uses: actions/setup-node@v4
        with:
          # Same Node as the Desktop runtime pin and the check:merge gate.
          node-version: 22.23.3
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - name: Test packages/core
        run: bun test src
        working-directory: packages/core

      - name: Test packages/storage
        run: bun test src
        working-directory: packages/storage

      - name: Test packages/quarry
        run: bun test src
        working-directory: packages/quarry

      - name: Test packages/smithy
        run: bun test src
        working-directory: packages/smithy
