name: Deploy Website

# Manual only. This fork (imcitius/stoneforge) is the main repository; the
# upstream stoneforge-ai/stoneforge project is no longer maintained.
# This workflow deploys to the upstream Cloudflare Pages project
# "stoneforge-ai" (stoneforge.ai) and needs CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets that the fork does not have. The automatic
# push-to-master and pull_request preview triggers were removed so that master
# pushes and PRs do not try to deploy to upstream hosting. The site sources in
# apps/website/ are kept. Run it manually only after configuring hosting and
# secrets that this repository owns.

on:
  workflow_dispatch:

concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy

    steps:
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not configured for this repository; refusing to deploy."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm turbo run build --filter=@stoneforge/website

      - name: Deploy to Cloudflare Pages
        working-directory: apps/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: pnpm exec wrangler pages deploy dist --project-name=stoneforge-ai --branch="$DEPLOY_BRANCH"
