<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
<title>Stoneforge Desktop</title><link rel="stylesheet" href="shell.css"></head>
<body>
<header id="titlebar"><div id="tabstrip">
<div id="projects" role="tablist" aria-label="Projects" aria-orientation="horizontal"></div>
<button id="tab-actions" type="button" aria-haspopup="menu" hidden>⋯</button>
<button id="overflow" type="button" aria-haspopup="menu" hidden>»</button>
<button id="add" type="button" aria-label="Add project" title="Add project">＋</button>
</div></header>
<div id="toolbar"><div id="title"><strong id="name">Your workspace</strong><span id="state" hidden></span><span id="path">Choose a project to begin</span></div>
<p id="add-progress" role="status" hidden></p>
<span id="build">macOS preview</span></div>
<main id="panel" role="tabpanel" aria-label="Your workspace">
<section id="empty"><h1>All your projects. One place.</h1><p>Choose a project folder. Open an existing workspace or set up Stoneforge in a new one.</p><button id="add-empty">Add project</button><p class="hint">Each project runs independently. Its files stay in their current location. Agents keep working when you switch tabs.</p></section>
<section id="status" hidden><h1 id="status-title"></h1><p id="status-text" role="status"></p>
<div id="status-actions"><button id="start" type="button">Start project</button><button id="status-logs" type="button">Show logs</button></div></section><p id="error" role="alert" hidden></p></main>
<script src="tab-layout.js"></script>
<script src="shell.js"></script></body></html>
